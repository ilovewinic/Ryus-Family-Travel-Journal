<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 길 & 들 - 가족 여행 & 등산 일지</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 50: '#f4f7f4', 100: '#e3ebe3', 600: '#52796f', 700: '#354f52', 800: '#2f3e46' },
                        earth: { 100: '#f7f4ef', 200: '#eae3d2', 800: '#4a3f35' }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Noto Serif KR"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f7f4ef; color: #2f3e46; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- 비밀번호 잠금 화면 -->
    <div id="authGate" class="fixed inset-0 bg-sage-800/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center border border-earth-200">
            <div class="w-16 h-16 bg-sage-100 rounded-full flex items-center justify-center mx-auto mb-4 text-sage-600">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-sage-800 mb-2">가족 전용 공간</h2>
            <p class="text-gray-600 text-sm mb-6">소중한 일지를 보시려면 가족 비밀번호를 입력해 주세요.</p>
            
            <form onsubmit="unlockSite(event)" class="space-y-4">
                <input type="password" id="gatePassword" placeholder="비밀번호 입력 (기본: family1234)" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sage-600 focus:outline-none text-center text-lg">
                <button type="submit" class="w-full bg-sage-600 hover:bg-sage-700 text-white font-medium py-3 rounded-xl transition duration-200">
                    입장하기
                </button>
            </form>
            <p id="gateError" class="text-red-500 text-xs mt-3 hidden">비밀번호가 올바르지 않습니다.</p>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-earth-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl text-sage-600"><i class="fa-solid fa-mountain-sun"></i></span>
                <h1 class="font-serif text-xl md:text-2xl font-bold tracking-tight text-sage-800">우리의 길 & 들</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal('writeModal')" class="bg-sage-600 hover:bg-sage-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-pen"></i>
                    <span class="hidden sm:inline">새 기록 추가</span>
                </button>
                <button onclick="openModal('settingsModal')" class="p-2 text-sage-700 hover:bg-sage-100 rounded-lg transition" title="설정">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <button onclick="lockSite()" class="p-2 text-gray-500 hover:bg-red-50 hover:text-red-600 rounded-lg transition" title="잠그기">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
        <section class="mb-10 text-center">
            <h2 class="font-serif text-2xl md:text-3xl font-semibold text-sage-800 mb-2">가족과 함께 발맞춰 걸은 흔적들</h2>
            <p class="text-gray-600 max-w-xl mx-auto text-sm md:text-base">산길 따라, 들길 따라 함께 쌓아 올린 추억과 풍경을 기록하는 사진 일지입니다.</p>
        </section>
        <div id="journalGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-earth-200 py-6 text-center text-xs text-gray-500">
        <p>© 2026 우리의 길 & 들. All rights reserved.</p>
    </footer>

    <!-- Write Modal -->
    <div id="writeModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="font-serif text-lg font-bold text-sage-800">새 일지 작성</h3>
                <button onclick="closeModal('writeModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="saveJournal(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
                    <input type="text" id="jTitle" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-600 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">장소 / 코스</label>
                        <input type="text" id="jLocation" required placeholder="예: 태백산 천제단 코스" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">방문 날짜</label>
                        <input type="date" id="jDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-600 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">사진 첨부 (Cloudflare R2)</label>
                    <input type="file" id="jPhoto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sage-100 file:text-sage-700 hover:file:bg-sage-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">이야기 / 메모</label>
                    <textarea id="jContent" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sage-600 focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('writeModal')" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">취소</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-sage-600 hover:bg-sage-700 text-white rounded-lg text-sm font-medium">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="font-serif text-lg font-bold text-sage-800">서비스 연결 & 비밀번호 설정</h3>
                <button onclick="closeModal('settingsModal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="saveSettings(event)" class="space-y-4 text-xs">
                <div class="border-b pb-3">
                    <label class="block font-semibold text-gray-700 mb-1">가족 접속 비밀번호 변경</label>
                    <input type="text" id="cfgPassword" placeholder="기본값: family1234" class="w-full px-3 py-2 border rounded-lg font-mono">
                </div>
                <div class="space-y-2">
                    <h4 class="font-bold text-sage-700">1. Supabase (데이터베이스)</h4>
                    <div><label class="block text-gray-600">Project URL</label><input type="text" id="cfgSupaUrl" class="w-full px-2 py-1.5 border rounded font-mono"></div>
                    <div><label class="block text-gray-600">Anon Public Key</label><input type="password" id="cfgSupaKey" class="w-full px-2 py-1.5 border rounded font-mono"></div>
                </div>
                <div class="space
