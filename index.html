<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 길 & 들 - 가족 여행 & 등산 일지</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #f7f4ef; color: #2f3e46; font-family: 'Noto Sans KR', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 비밀번호 잠금 화면 -->
    <div id="authGate" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-700">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">가족 전용 공간</h2>
            <p class="text-gray-600 text-sm mb-6">비밀번호를 입력해 주세요. (기본: family1234)</p>
            
            <div class="space-y-4">
                <input type="password" id="gatePassword" placeholder="비밀번호 입력" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-center text-lg">
                <button type="button" onclick="tryUnlock()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl transition">
                    입장하기
                </button>
            </div>
            <p id="gateError" class="text-red-500 text-xs mt-3 hidden">비밀번호가 틀렸습니다.</p>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl text-emerald-700"><i class="fa-solid fa-mountain-sun"></i></span>
                <h1 class="font-bold text-xl text-slate-800">우리의 길 & 들</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="document.getElementById('writeModal').classList.remove('hidden')" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">새 기록 추가</button>
                <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="p-2 text-slate-700 hover:bg-gray-100 rounded-lg"><i class="fa-solid fa-gear text-lg"></i></button>
                <button onclick="localStorage.removeItem('unlocked'); location.reload();" class="p-2 text-gray-500 hover:text-red-600 rounded-lg"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
        <section class="mb-10 text-center">
            <h2 class="text-2xl font-semibold text-slate-800 mb-2">가족과 함께 발맞춰 걸은 흔적들</h2>
            <p class="text-gray-600 text-sm">산길 따라, 들길 따라 함께 쌓아 올린 추억과 풍경</p>
        </section>
        <div id="journalGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Write Modal -->
    <div id="writeModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">새 일지 작성</h3>
            <form onsubmit="saveJournal(event)" class="space-y-4">
                <input type="text" id="jTitle" placeholder="제목" required class="w-full px-3 py-2 border rounded-lg">
                <input type="text" id="jLocation" placeholder="장소 / 코스" required class="w-full px-3 py-2 border rounded-lg">
                <input type="date" id="jDate" required class="w-full px-3 py-2 border rounded-lg">
                <input type="file" id="jPhoto" accept="image/*" class="w-full text-xs">
                <textarea id="jContent" placeholder="이야기" rows="3" required class="w-full px-3 py-2 border rounded-lg"></
